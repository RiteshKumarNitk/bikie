services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # DATABASE_URL/DIRECT_URL intentionally omitted: the build no longer needs
        # Postgres reachable (see Dockerfile). Runtime DB config comes from env_file below.
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}

        BETTER_AUTH_URL: https://bikie.app
        NEXT_PUBLIC_APP_URL: https://bikie.app

        NEXT_PUBLIC_MSG91_WIDGET_ID: ${NEXT_PUBLIC_MSG91_WIDGET_ID}
        NEXT_PUBLIC_MSG91_WIDGET_TOKEN_AUTH: ${NEXT_PUBLIC_MSG91_WIDGET_TOKEN_AUTH}
    restart: unless-stopped
    # Host 3000 is taken by another local project, and the container port must match
    # the published one: server components self-fetch /api/* using the request's Host
    # header, so "localhost:3001" has to resolve inside the container too.
    ports:
      - "3001:3001"
    env_file:
      - ./apps/.env
    environment:
      SHOW_OTP_TOAST: "true"
      SEED_DB: "false"

      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"

      BETTER_AUTH_URL: https://bikie.app
      NEXT_PUBLIC_APP_URL: https://bikie.app

      NEXT_PUBLIC_MSG91_WIDGET_ID: ${NEXT_PUBLIC_MSG91_WIDGET_ID}
      NEXT_PUBLIC_MSG91_WIDGET_TOKEN_AUTH: ${NEXT_PUBLIC_MSG91_WIDGET_TOKEN_AUTH}
