name: Deploy to Production

on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Validate Deployment Secrets
        run: |
          MISSING_SECRETS=0

          if [ -z "$VPS_HOST" ]; then
            echo "::error::GitHub Actions secret VPS_HOST is not configured."
            MISSING_SECRETS=1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "::error::GitHub Actions secret VPS_USER is not configured."
            MISSING_SECRETS=1
          fi

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::GitHub Actions secret VPS_SSH_KEY is not configured."
            MISSING_SECRETS=1
          fi

          if [ "$MISSING_SECRETS" -ne 0 ]; then
            echo "ERROR: Required deployment secrets are missing in GitHub repository settings."
            echo "Please configure VPS_HOST, VPS_USER, and VPS_SSH_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "All required deployment secrets are configured."
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH private key with trailing newline
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Default SSH port to 22 if not configured
          SSH_PORT="${VPS_PORT:-22}"

          # Scan and register host key in known_hosts to prevent MITM attacks
          ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true

          # Configure SSH client
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}

      - name: Execute Deployment on VPS
        run: |
          ssh vps 'bash -s' << 'EOF'
          set -euo pipefail

          echo "==> 1. Checking deployment directory /opt/bikie..."
          if [ ! -d "/opt/bikie" ]; then
            echo "ERROR: Directory /opt/bikie does not exist on the VPS."
            exit 1
          fi
          cd /opt/bikie

          echo "==> 2. Verifying Git repository status..."
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "ERROR: /opt/bikie is not a valid Git repository."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Uncommitted local changes detected in /opt/bikie."
            echo "Deployment stopped safely to prevent overwriting local files."
            git status --short
            exit 1
          fi

          echo "==> 3. Fetching and pulling latest changes from master..."
          git fetch origin master
          git pull --ff-only origin master

          echo "==> 4. Building Next.js web image..."
          docker compose build web

          echo "==> 5. Starting/updating web service container..."
          docker compose up -d --no-deps web

          echo "==> 6. Performing HTTP health check on http://127.0.0.1:3001/..."
          MAX_ATTEMPTS=30
          ATTEMPT=1
          HEALTHY=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            # Check if web container crashed
            if [ "$(docker compose ps --status running -q web 2>/dev/null | wc -l)" -eq 0 ]; then
              echo "ERROR: Web container is not running (crashed or failed to start)."
              docker compose logs --tail=100 web
              exit 1
            fi

            # Check HTTP response status code
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3001/ || echo "000")

            case "$HTTP_STATUS" in
              200|301|302|307|308)
                echo "Health check passed! (HTTP $HTTP_STATUS on attempt $ATTEMPT/$MAX_ATTEMPTS)"
                HEALTHY=true
                break
                ;;
              *)
                echo "Waiting for web service... Attempt $ATTEMPT/$MAX_ATTEMPTS (HTTP status: $HTTP_STATUS)"
                sleep 2
                ;;
            esac

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Health check failed after $MAX_ATTEMPTS attempts."
            echo "Displaying recent web container logs:"
            docker compose logs --tail=100 web
            exit 1
          fi

          echo "==> Deployment successfully completed!"
          EOF
